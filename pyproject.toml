[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botaghota"
version = "0.1.0"
description = "Polite, crash-safe, dependency-free web crawler and data-discovery engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "programmermunna"}]
keywords = ["crawler", "scraping", "sqlite", "polite", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
# Core stays dependency-free. Everything below is an optional extra.
dependencies = []

[project.optional-dependencies]
toml = ["tomli; python_version < '3.11'"]   # full TOML on old Pythons
dev = ["pytest", "ruff", "tomli; python_version < '3.11'"]

[project.scripts]
botaghota = "botaghota:main"

[tool.setuptools]
py-modules = ["botaghota"]

[tool.ruff]
target-version = "py310"
line-length = 80
